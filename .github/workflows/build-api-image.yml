# Constrói a imagem da API no runner do GitHub e publica em
#   ghcr.io/changzaoo/aurial-api:<sha curto da main> (e :latest).
#
# Por quê: o servidor vnmax (Celeron N4020, 2 núcleos, 3,4 GB) entrou em
# thrashing em 27/10/2026 construindo essa imagem; a regra passou a ser
# "nunca buildar imagem docker no vnmax". Lá, infra/scripts/deploy-api.sh com
# API_IMAGE=ghcr.io/changzaoo/aurial-api só faz `docker pull` da tag do commit.
#
# O pacote precisa ser PÚBLICO (uma vez, em github.com → Packages → aurial-api
# → Package settings → Change visibility) para o servidor puxar sem login;
# senão, `docker login ghcr.io` lá com um token read:packages.
name: Build API image

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-api-image.yml'
  workflow_dispatch:

concurrency:
  group: build-api-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: docker build + push (ghcr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sha curto
        id: sha
        run: echo "curto=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.curto }}
          tags: |
            ghcr.io/changzaoo/aurial-api:${{ steps.sha.outputs.curto }}
            ghcr.io/changzaoo/aurial-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: echo "imagem ghcr.io/changzaoo/aurial-api:${{ steps.sha.outputs.curto }}" >> "$GITHUB_STEP_SUMMARY"
